name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Guard all tracked files without printing matched values
        env:
          ZTT_PRIVATE_IDENTIFIER: ${{ secrets.ZTT_PRIVATE_IDENTIFIER }}
        run: python tools/check_public.py
      - name: The map, the README and the tree must agree
        run: python tools/check_docs.py
      - name: Unit tests with terminal stubbed and external sockets blocked
        run: python tools/run_tests.py
      - name: Correctness lint
        run: python -m ruff check --no-cache .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        with:
          node-version: "26.12.1"
      - name: Dashboard state and transport fixtures
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: node --test dashboard/tests/ui.test.cjs
      - name: Audit installed Python dependencies
        run: python -m pip_audit --progress-spinner off
      - name: Validate release build from tracked source
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python tools/build_public.py --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt
      - name: Build, test and lint locked dashboard dependencies
        run: |
          cargo build --release --locked --manifest-path dashboard/Cargo.toml
          cargo test --locked --manifest-path dashboard/Cargo.toml
          cargo clippy --locked --manifest-path dashboard/Cargo.toml -- -D warnings
