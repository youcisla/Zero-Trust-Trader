name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded push must not keep burning runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.14"}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      # Report-only until the type backlog is cleared; then drop
      # continue-on-error to make it blocking.
      - name: Type check (pyright)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        continue-on-error: true
        run: python -m pyright
      - name: Guard all tracked files without printing matched values
        env:
          ZTT_PRIVATE_IDENTIFIER: ${{ secrets.ZTT_PRIVATE_IDENTIFIER }}
          # Empty secret == no expectation. When the owner configures the secret,
          # every later run (including a fork PR that cannot see it) is held to it.
          ZTT_EXPECT_IDENTIFIER: ${{ secrets.ZTT_PRIVATE_IDENTIFIER != '' && '1' || '' }}
        run: python tools/check_public.py
      - name: The map, the README and the tree must agree
        run: python tools/check_docs.py
      - name: Unit tests with terminal stubbed and external sockets blocked
        run: python tools/run_tests.py
      - name: Correctness lint
        run: python -m ruff check --no-cache .
      # The legacy tree predates `ruff format` (66 files would change, several of
      # them frozen by this ticket's non-goals), so the gate covers the files
      # this ticket formats. The pre-commit hook formats every file a contributor
      # touches, which is how the backlog drains without a mass rewrite.
      - name: Formatting (ruff) on the files this ticket formats
        run: >-
          python -m ruff format --check
          tools/vol_dispersion.py tools/broker_math.py tests/test_tools_market_watch.py
      # Measured in CI at 60% on 2026-11-11; the floor sits two points below so a
      # refactor that deletes covered code does not fail the build, and a drop below
      # it is a real regression rather than noise.
      - name: Branch coverage, with a floor
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          python -m coverage run --branch --source=. --omit="tests/*,tools/*,dashboard/*" -m unittest discover -s tests
          python -m coverage report --include="*.py" --omit="tests/*,tools/*" --fail-under=58
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        with:
          node-version-file: .nvmrc
      - name: Dashboard state and transport fixtures
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: node --test dashboard/tests/ui.test.cjs
      # Once, on the declared closure. `pip-audit` with no arguments audits the
      # installed environment - ruff and pip-audit's own transitives included -
      # in all four cells, which is a different (and noisier) question.
      - name: Audit declared Python dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: >-
          python -m pip_audit --progress-spinner off
          -r requirements.txt -r requirements-dev.txt
      - name: Validate release build from tracked source
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python tools/build_public.py --check

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # One source of truth: the channel, profile and components come from
      # dashboard/rust-toolchain.toml, and `rustup toolchain install` with no
      # argument installs the toolchain active in this directory. The pinned
      # action cannot do that without taking a duplicated `toolchain:` input.
      - name: Install the toolchain pinned in dashboard/rust-toolchain.toml
        working-directory: dashboard
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: dashboard
      - name: Install the pinned advisory scanner
        run: cargo install cargo-audit --locked --version 0.21.0
      - name: Build, test and lint locked dashboard dependencies
        working-directory: dashboard
        run: |
          cargo build --release --locked
          cargo test --locked
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: Audit locked dependencies (fails on a known vulnerability)
        working-directory: dashboard
        run: cargo audit

  # The dashboard ships on Windows (`start_dashboard.bat`, `py -3`, APPDATA).
  # A Linux-only Rust job never executes those branches.
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the toolchain pinned in dashboard/rust-toolchain.toml
        working-directory: dashboard
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: dashboard
      - name: Test the dashboard on the platform it runs on
        working-directory: dashboard
        run: cargo test --locked
