name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # MetaTrader5 is Windows-only and is not installed here. The test suite
      # stubs it, so the indicators and the safety guards still run.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Syntax-check every module
        run: python -m compileall -q . -x '(^|/)(\.git|tests)/'

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # The repository is public: machine paths, the broker account number and
      # key material must never reach it. This makes the sanitiser permanent
      # rather than a one-time step somebody has to remember.
      #
      # Scans TRACKED files only (git ls-files), not the working tree: local
      # runtime artifacts like engine_state.json legitimately contain the
      # account number and are gitignored. What matters is what ships.
      # ci.yml excludes itself because it necessarily contains the patterns.
      - name: Guard against leaked paths or credentials
        run: |
          # Build artifacts must never be tracked: cargo embeds absolute source
          # paths (C:\Users\<name>\.cargo\...) into target/.
          if git ls-files | grep -q '^dashboard/target/'; then
            echo "::error::build artifacts are tracked (dashboard/target/)"
            exit 1
          fi
          # -F: fixed strings. Without it, BRE reads '\U' as a literal 'U' and
          # the Windows-path pattern silently never matches.
          if git ls-files | grep -v '^\.github/workflows/ci\.yml$' | xargs grep -In -F \
               -e 'C:\Users' \
               -e '62155913' \
               -e 'ghp_' \
               -e 'gho_' \
               -e 'AppData\Roaming\mt5-mcp' ; then
            echo "::error::personal data or key material found in the repository"
            exit 1
          fi
          echo "clean"

      # compileall only proves it parses. An undefined name parses fine and
      # crashes at runtime - that is exactly how a NameError reached production
      # twelve times in a row while CI stayed green. F821 is precisely that bug.
      - name: Lint for undefined names
        run: |
          python -m pip install --quiet ruff
          ruff check --select F821 --no-cache .

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build and lint the dashboard
        run: |
          cargo build --release --manifest-path dashboard/Cargo.toml
          cargo test --release --manifest-path dashboard/Cargo.toml
          cargo clippy --manifest-path dashboard/Cargo.toml -- -D warnings
