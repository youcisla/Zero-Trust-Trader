# Feeds the desk's scout may read. Empty = the scout reports "no feed configured"
# and makes no model call.
#
# Kept out of config.toml on purpose: that file is the MCP bridge's claim about
# its own policy, and its schema rejects unknown sections — adding [agents]
# there made policy_check.py fail with extra_forbidden.
news_feeds = [
  "https://feeds.bbci.co.uk/news/business/rss.xml",
  "https://www.investing.com/rss/news_1.rss",
]

# The decision model (typesafe/jev) is on in this tree: it runs unless
# jev_enabled is false here or ZTT_JEV=0 is set in the environment or .env
# (ZTT_JEV wins either way). It stays advisory: nothing here can gate, size,
# approve or veto.
[decisions]
jev_enabled = true
