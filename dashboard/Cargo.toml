[package]
name = "zero-trust-dashboard"
version = "0.1.0"
edition = "2021"
description = "Local read-only dashboard for the Zero-Trust Trader engine"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
