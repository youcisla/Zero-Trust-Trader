const SUBS = {
  flow: "nine stages, and where the funnel stopped",
  overview: "is it alive, what did it decide, what do I hold",
  research: "what was tested, and why it was refused",
  performance: "what the account and the candidates did",
  trials: "every hypothesis ever tested, and the bar it set",
  ops: "health, alerts, and the raw files",
};

const ICONS = {
  flow: "M4 6h6v4H4zM14 6h6v4h-6zM9 12h6v4H9zM4 18h6v2H4zM14 18h6v2h-6",
  overview: "M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6",
  research: "M4 19V5m0 14h16M8 15l3-4 3 2 5-6",
  performance: "M4 16l5-6 4 3 7-9",
  trials: "M4 18V9m4 9V6m4 12v-7m4 7V4m4 14v-5",
  ops: "M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3",
};

function useRoute() {
  const read = () => (location.hash.replace(/^#\/?/, "") || "flow");
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const on = () => setRoute(read());
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  return route;
}

function App() {
  const [data, setData] = useState(null);
  const [up, setUp] = useState(false);
  const [err, setErr] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [range, setRange] = useState("2h");
  const [allState, setAllState] = useState("");
  const [running, setRunning] = useState(false);
  const receivedAt = useRef(null);
  const route = useRoute();

  useEffect(() => {
    let alive = true, ws, retry;
    const connect = () => {
      ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
      ws.onopen = () => { if (alive) { receivedAt.current = null; setUp(false); setErr("waiting for heartbeat"); } };
      ws.onclose = () => { if (!alive) return; setUp(false); retry = setTimeout(connect, 1500); };
      ws.onerror = () => { if (alive) setErr("websocket error"); };
      ws.onmessage = (e) => {
        if (!alive) return;
        try {
          const next = JSON.parse(e.data);
          if (!next || typeof next.ts !== "number" || !("engine" in next)) throw new Error("invalid snapshot");
          receivedAt.current = Date.now(); setElapsed(0); setData(next); setUp(true); setErr(null);
        } catch (_) { setUp(false); setErr("invalid snapshot"); }
      };
    };
    connect();
    const watchdog = setInterval(() => {
      if (receivedAt.current == null) return;
      setElapsed(Math.max(0, Math.floor((Date.now() - receivedAt.current) / 1000)));
      if (!transportFresh(receivedAt.current)) { setUp(false); setErr("heartbeat stale"); }
    }, 1000);
    return () => { alive = false; clearInterval(watchdog); clearTimeout(retry); try { ws.close(); } catch (_) {} };
  }, []);

  // A tab that was in the background catches up on the first second back.
  useEffect(() => {
    const on = () => {
      if (document.visibilityState !== "visible") return;
      fetch("/api/snapshot").then((r) => r.json()).then((j) => {
        if (j && typeof j.ts === "number") { setData(j); receivedAt.current = Date.now(); setElapsed(0); setUp(true); }
      }).catch(() => {});
    };
    document.addEventListener("visibilitychange", on);
    return () => document.removeEventListener("visibilitychange", on);
  }, []);

  const copyAll = useCallback(async () => {
    try {
      const names = ["audit", "funnel", "actions"];
      const parts = await Promise.all(names.map(async (n) => {
        const r = await fetch("/api/logs/" + n);
        if (!r.ok) throw new Error("log " + n + " unavailable");
        return `# ${n}  (${new Date().toISOString()})\n` + await r.text();
      }));
      await navigator.clipboard.writeText(parts.join("\n\n"));
      setAllState("done");
    } catch (e) { setAllState("fail"); }
    setTimeout(() => setAllState(""), 1600);
  }, []);

  // The only button that writes anything: POST /api/scan → run_funnel.py, the same
  // entry the scheduler runs. Nothing on this path is an order path.
  const runScan = useCallback(async () => {
    setRunning(true);
    try {
      const r = await fetch("/api/scan", {method: "POST"});
      if (!r.ok) setErr("scan refused (" + r.status + ")");
    } catch (e) { setErr("scan request failed"); }
    setTimeout(() => setRunning(false), 6000);
  }, []);

  const d = derive(data, up, elapsed);
  const alerts = (data && data.alerts) || [];
  const version = data ? data.ts : 0;

  return html`<div className="app">
    <aside className="side">
      <div className="brand">
        <div className="mark">ZT</div>
        <div><h1>Zero-Trust</h1><div className="sub">demo · monitor</div></div>
      </div>
      <nav className="nav" aria-label="pages">
        ${ROUTES.map(([k, label, key]) => html`<a key=${k} href=${"#/" + k}
          className=${"navitem" + (route === k ? " on" : "")} aria-current=${route === k ? "page" : "false"}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
            strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d=${ICONS[k]} /></svg>
          <span className="lbl">${label}</span><span className="kbd">${key}</span>
        </a>`)}
      </nav>
      <div className="grow"></div>
      <div className="sidenote">
        <b>${d.x.last ? "last scan " + (d.x.last.ts || "").slice(11, 16) + "Z" : "no scan yet"}</b>
        ${d.x.in == null ? "no universe on disk" : d.x.in + " symbols · " + (d.x.tests ?? 0) + " tests"}
      </div>
      <a className="sidelink" href="/architecture" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true">
          <path d="M4 20V8l8-4 8 4v12M4 20h16" /></svg><span>Architecture ↗</span></a>
      <a className="sidelink" href="/api/report/latest" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true">
          <path d="M6 3h9l4 4v14H6z" /><path d="M9 12h7M9 16h5" /></svg><span>Last report ↗</span></a>
    </aside>

    <div className="main">
      <div className="topbar">
        <div>
          <div className="pagetitle">${(ROUTES.find((r) => r[0] === route) || ROUTES[0])[1]}</div>
          <div className="pagesub">${SUBS[route] || SUBS.flow}</div>
        </div>
        <span className="spacer"></span>
        <button className=${"pill bell" + (alerts.length ? " has" : "")} onClick=${() => { location.hash = "#/ops"; }}
          aria-label=${alerts.length + " alerts"}>◔ ${alerts.length}</button>
        <span className=${"pill " + (up ? "live" : "down")} aria-live="polite"
          title="the browser socket to this dashboard — not the engine heartbeat"><span className="dot"></span>${up ? "socket live" : "socket down"}</span>
        ${d.age != null && d.age > 30 ? html`<span className="pill stale">${fmtDur(d.age)} stale</span>` : null}
        ${data && !data.engine ? html`<span className="pill down">engine state missing</span>` : null}
        ${data && data.engine && data.engine.ok === false ? html`<span className="pill down" title=${data.engine.error || ""}>engine refusing</span>` : null}
        ${err ? html`<span className="pill down">${err}</span>` : null}
        <span className="pill tz" title="Files are UTC; times are shown in your zone">${TZ}</span>
        <button className=${"copy " + allState} onClick=${copyAll} aria-live="polite">
          ${allState === "done" ? "copied ✓" : allState === "fail" ? "copy failed" : "copy recent logs"}</button>
        <div className="equity mono"><b>${money(data && data.equity, data && data.currency)}</b><span>equity</span></div>
      </div>

      <div className="progress">
        <button className=${"runbtn" + (running ? " armed" : "")} disabled=${running} onClick=${runScan}
          title="runs exactly what the scheduler runs; it takes the same lock">
          ${running ? "starting…" : "▶ Run scan now"}</button>
        ${!data || !data.progress ? html`<span className="l-faint">no scan progress recorded on this tree yet</span>`
          : html`${["preflight", "universe", "tier2", "tier3", "verdict"].map((k, i) => {
              const idx = ["preflight", "universe", "tier2", "tier3", "verdict"].indexOf(data.progress.stage);
              const done = data.progress.status === "done" || i < idx;
              return html`<span key=${k} className=${"stage " + (done ? "done" : i === idx ? "now" : "todo")}>
                ${done ? "✓ " : ""}${k}</span>`;
            })}
            ${data.progress.verdict ? html`<span className=${"badge " + (data.progress.verdict === "PROPOSAL" ? "pass" : "")}>${data.progress.verdict}</span>` : null}
            <span className="l-faint">${data.progress.tests != null ? num0(data.progress.tests) + " tests" : ""}</span>`}
        <span className="spacer"></span>
        <span className="l-faint">the button cannot place an order — see §9 of AGENTS.md</span>
      </div>

      <main className="page">
        ${route === "flow" ? html`<${FlowPage} d=${d} data=${data} />` : null}
        ${route === "overview" ? html`<${Overview} d=${d} data=${data} range=${range} setRange=${setRange} />` : null}
        ${route === "research" ? html`<${Research} d=${d} data=${data} />` : null}
        ${route === "performance" ? html`<${Performance} d=${d} data=${data} />` : null}
        ${route === "trials" ? html`<${Trials} d=${d} data=${data} />` : null}
        ${route === "ops" ? html`<${Ops} d=${d} data=${data} />` : null}
      </main>
    </div>
  </div>`;
}

// Keyboard 1–6, ignored while typing in a field.
document.addEventListener("keydown", (e) => {
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const hit = ROUTES.find((r) => r[2] === e.key);
  if (hit) location.hash = "#/" + hit[0];
});

/* If a render throws, the page says so instead of going blank. A monitor that
   silently shows nothing is the failure mode this project exists to avoid. */
class Boundary extends React.Component {
  constructor(props) { super(props); this.state = {err: null}; }
  static getDerivedStateFromError(err) { return {err: err}; }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div style=${{padding: "24px", color: "#ff4d5e", fontFamily: "ui-monospace, monospace"}}>
      <b>the dashboard failed to render</b>
      <pre style=${{whiteSpace: "pre-wrap", color: "#e8f0f2", marginTop: "8px"}}>${String(this.state.err && this.state.err.stack || this.state.err)}</pre>
      <div style=${{color: "#8b9bab", marginTop: "8px"}}>The engine is unaffected — this is the viewer only.</div>
    </div>`;
  }
}

ReactDOM.createRoot(document.getElementById("root"))
  .render(html`<${Boundary}><${App} /><//>`);
})();

</script>
</body>
</html>
