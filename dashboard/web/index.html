<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero-Trust Trader</title>
<!--
  One file, no build step, no CDN.
  React 18 + htm + ECharts are vendored under web/vendor/ with PROVENANCE.json
  (pinned npm tarball, sha256, licence text). Nothing here is fetched at runtime.

  The rule this page serves: the engine never knows it exists. Everything on
  screen is read from files the engine already writes. The single exception is
  POST /api/scan, which starts the research pipeline and cannot place an order.
-->
<style>
  /* ---- design tokens: neon terminal ---------------------------------- */
  :root{
    --bg:#050608; --bg-grid:rgba(0,255,170,.025);
    --surface:#0b0e12; --surface2:#10151b; --surface3:#161d26;
    --line:#1c2430; --line2:#28323f;
    --ink:#e8f0f2; --dim:#8b9bab; --faint:#5b6a79;
    --neon:#00ffa3; --neon-dim:rgba(0,255,163,.12);
    --cyan:#22d3ee; --cyan-dim:rgba(34,211,238,.12);
    --magenta:#f472b6; --magenta-dim:rgba(244,114,182,.12);
    --amber:#ffb454; --amber-dim:rgba(255,180,84,.12);
    --red:#ff4d5e; --red-dim:rgba(255,77,94,.12);
    /* legacy names the components already speak */
    --good:var(--neon); --warn:var(--amber); --bad:var(--red); --accent:var(--cyan);
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --font-ui:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --t1:11px; --t2:12px; --t3:13px; --t4:15px; --t5:20px; --t6:28px; --t7:40px;
    --r:10px; --r-sm:7px;
    --glow:0 0 12px var(--neon-dim),0 0 2px rgba(0,255,163,.4);
    --glow-cyan:0 0 12px var(--cyan-dim);
    --shadow:0 8px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--font-ui);
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),
                     linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
    background-size:36px 36px}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:var(--r-sm)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1d2530;border-radius:99px;border:2px solid var(--bg)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ---- shell ---------------------------------------------------------- */
  .app{position:relative;z-index:1;display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#080b0f,#06080b);border-right:1px solid var(--line);
    padding:var(--s4) var(--s3)}
  .brand{display:flex;align-items:center;gap:10px;padding:0 var(--s2) var(--s5)}
  .mark{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    background:linear-gradient(160deg,#0b2b22,#071a15);border:1px solid #14453a;
    color:var(--neon);font-size:11px;font-weight:700;letter-spacing:.02em;
    box-shadow:inset 0 0 12px rgba(0,255,163,.12)}
  .brand h1{font-size:13px;margin:0;font-weight:600;letter-spacing:-.01em}
  .brand .sub{color:var(--faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .nav{display:flex;flex-direction:column;gap:2px}
  .navitem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;
    color:var(--dim);font-size:12.5px;text-align:left;transition:background .12s,color .12s}
  .navitem svg{width:14px;height:14px;flex:0 0 14px;opacity:.75}
  .navitem:hover{background:var(--surface2);color:var(--ink)}
  .navitem.on{background:var(--neon-dim);color:#c8ffe8;box-shadow:inset 0 0 0 1px #17453a}
  .navitem.on svg{opacity:1;color:var(--neon)}
  .navitem .kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--faint);
    border:1px solid var(--line2);border-radius:4px;padding:0 4px}
  .grow{flex:1}
  .sidenote{color:var(--faint);font-size:11px;line-height:1.5;padding:var(--s2);border-top:1px solid var(--line)}
  .sidenote b{display:block;color:var(--dim);font-weight:500;font-size:11px}
  .sidelink{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11.5px;
    padding:5px var(--s2);border-radius:6px;text-decoration:none}
  .sidelink:hover{background:var(--surface2);color:var(--ink)}

  /* ---- topbar --------------------------------------------------------- */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
    border-bottom:1px solid var(--line);background:rgba(8,11,15,.86);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .pagetitle{font-size:var(--t4);font-weight:600;letter-spacing:-.01em}
  .pagesub{color:var(--faint);font-size:11px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;
    border-radius:99px;border:1px solid var(--line2);background:var(--surface2);color:var(--dim)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .pill.live{border-color:#155a44;color:#9dffd4;background:rgba(0,255,163,.07)}
  .pill.live .dot{background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 2s infinite}
  .pill.stale{color:var(--amber);border-color:#5a4218;background:var(--amber-dim)}
  .pill.down{color:var(--red);border-color:#5c2026;background:var(--red-dim)}
  .pill.tz{color:var(--faint)}
  .pill.bell{border-color:var(--line2);color:var(--dim);cursor:pointer}
  .pill.bell.has{color:var(--amber);border-color:#5a4218;background:var(--amber-dim)}
  .copy{font-size:11.5px;padding:4px 10px;border:1px solid var(--line2);border-radius:var(--r-sm);
    background:var(--surface2);color:var(--dim)}
  .copy:hover{color:var(--ink);border-color:var(--neon)}
  .copy.done{color:var(--neon);border-color:#155a44}
  .copy.fail{color:var(--red);border-color:#5c2026}
  .equity{margin-left:auto;text-align:right;line-height:1.1}
  .equity b{font-size:var(--t4);font-weight:600}
  .equity span{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---- scan bar ------------------------------------------------------- */
  .progress{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;font-size:11.5px;
    color:var(--dim);padding:7px var(--s4);border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--surface2),rgba(11,14,18,.6))}
  .progress .stage{display:inline-flex;align-items:center;gap:5px}
  .progress .stage.done{color:var(--neon)}
  .progress .stage.now{color:var(--ink);font-weight:600}
  .progress .stage.now:before{content:"";width:7px;height:7px;border-radius:50%;
    background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.1s infinite}
  .progress .stage.todo{color:var(--faint)}
  .runbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:6px 11px;border-radius:var(--r-sm);border:1px solid var(--line2);
    background:var(--surface3);color:var(--ink)}
  .runbtn:hover{border-color:var(--neon);box-shadow:var(--glow)}
  .runbtn:disabled{opacity:.55;cursor:progress}
  .runbtn.armed{border-color:var(--neon);color:var(--neon);background:var(--neon-dim)}

  /* ---- page & cards --------------------------------------------------- */
  .page{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
  .contents{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
  .grid{display:grid;gap:var(--s4);min-width:0}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
  .card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
    overflow:hidden;min-width:0}
  .card>header{display:flex;align-items:center;gap:var(--s2);padding:9px var(--s3);
    border-bottom:1px solid var(--line);background:var(--surface2);min-height:38px}
  .card>header h2{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--dim)}
  .card>header .note{color:var(--faint);font-size:10.5px;margin-left:auto;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
  .card .body{padding:var(--s3);min-width:0}
  .card .flush{padding:0}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 7px;
    border-radius:99px;border:1px solid var(--line2);color:var(--dim);background:var(--surface3);
    font-family:var(--font-mono)}
  .badge.pass{color:var(--neon);border-color:#155a44;background:var(--neon-dim)}
  .badge.warn{color:var(--amber);border-color:#5a4218;background:var(--amber-dim)}
  .badge.bad{color:var(--red);border-color:#5c2026;background:var(--red-dim)}
  .badge.info{color:var(--cyan);border-color:#14454f;background:var(--cyan-dim)}
  .kpi{display:flex;flex-direction:column;gap:2px}
  .kpi .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .kpi .v{font-size:var(--t5);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .kpi .h{font-size:11px;color:var(--dim)}
  .l-dim{color:var(--dim)} .l-faint{color:var(--faint)}
  .l-good{color:var(--neon)} .l-warn{color:var(--amber)} .l-bad{color:var(--red)}
  .empty{display:flex;flex-direction:column;gap:6px;align-items:flex-start;
    color:var(--dim);font-size:12px;padding:var(--s4)}
  .empty code{font-family:var(--font-mono);font-size:11px;color:var(--cyan);
    background:var(--surface3);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}

  /* ---- tables --------------------------------------------------------- */
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;font-weight:500;color:var(--faint);font-size:10px;letter-spacing:.07em;
    text-transform:uppercase;padding:6px var(--s3);border-bottom:1px solid var(--line)}
  td{padding:6px var(--s3);border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:rgba(255,255,255,.012)}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}

  /* ---- verdict hero --------------------------------------------------- */
  .hero{border:1px solid #3a2330;border-left:3px solid var(--magenta);border-radius:var(--r);
    background:linear-gradient(90deg,rgba(244,114,182,.08),rgba(244,114,182,.01) 60%,transparent);
    padding:var(--s4) var(--s5);display:flex;align-items:center;gap:var(--s5);flex-wrap:wrap}
  .hero.up{border-color:#11523d;border-left-color:var(--neon);
    background:linear-gradient(90deg,rgba(0,255,163,.09),rgba(0,255,163,.01) 60%,transparent)}
  .hero.pending{border-color:#5a4218;border-left-color:var(--amber);
    background:linear-gradient(90deg,rgba(255,180,84,.08),transparent 60%)}
  .hero .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:2px 8px;border-radius:99px;border:1px solid currentColor;color:var(--magenta)}
  .hero.up .tag{color:var(--neon)}
  .hero.pending .tag{color:var(--amber)}
  .hero h2{margin:0;font-size:var(--t5);font-weight:600;letter-spacing:-.015em}
  .hero .sub{color:var(--dim);font-size:12px}
  .hero .stats{margin-left:auto;display:flex;gap:var(--s5);text-align:right}
  .hero .stats div span{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

  /* ---- desk chain ----------------------------------------------------- */
  .chain{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
  .step{flex:1 1 150px;min-width:120px;border:1px solid var(--line);border-radius:8px;
    padding:7px 9px;background:var(--surface2);position:relative}
  .step:after{content:"";position:absolute;right:-6px;top:50%;width:6px;height:1px;background:var(--line2)}
  .step:last-child:after{display:none}
  .step .who{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--faint)}
  .step .dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .step.ok .dot{background:var(--neon);box-shadow:0 0 6px var(--neon)}
  .step.warn .dot{background:var(--amber)}
  .step.bad .dot{background:var(--red)}
  .step .say{font-size:11.5px;color:var(--ink);margin-top:3px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---- flow canvas ---------------------------------------------------- */
  .flowwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);
    background:radial-gradient(1200px 400px at 20% 0%,rgba(0,255,163,.04),transparent 70%),var(--surface);
    overflow:hidden}
  .flowtop{display:flex;align-items:center;gap:var(--s2);padding:8px var(--s3);
    border-bottom:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
  .flowtop .hint{color:var(--faint);font-size:10.5px;margin-left:auto}
  .flowsvg{display:block;width:100%;height:calc(100vh - 258px);min-height:420px;
    cursor:grab;touch-action:none}
  .flowsvg.dragging{cursor:grabbing}
  .node{cursor:pointer}
  .node rect{fill:var(--surface2);stroke:var(--line2);stroke-width:1;rx:9}
  .node.live rect{stroke:#1a6b52}
  .node.hot rect{stroke:var(--neon);filter:drop-shadow(0 0 6px rgba(0,255,163,.35))}
  .node.bad rect{stroke:var(--red)}
  .node.warn rect{stroke:var(--amber)}
  .node.sel rect{stroke:var(--cyan);stroke-width:2}
  .node text{fill:var(--ink);font-family:var(--font-ui)}
  .node .t{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;fill:var(--dim)}
  .node .s{font-size:16px;font-family:var(--font-mono);font-weight:600}
  .node .c{font-size:10.5px;fill:var(--faint)}
  .edge{fill:none;stroke:var(--line2);stroke-width:1.4}
  .edge.hot{stroke:var(--neon);stroke-width:1.8;stroke-dasharray:5 5;animation:dash 1.1s linear infinite}
  .edge.blocked{stroke:var(--red);stroke-dasharray:4 4}
  .edge.dim{stroke:var(--line2);opacity:.5}
  .edge.replay{stroke:var(--cyan);stroke-width:2}
  @keyframes dash{to{stroke-dashoffset:-20}}
  .elabel{font-family:var(--font-mono);font-size:10px;fill:var(--dim)}
  .elabel.bad{fill:var(--red);font-weight:600}
  .elabel-bg{fill:var(--surface);stroke:var(--line)}
  .chip-stop{fill:var(--red-dim);stroke:var(--red);rx:4}
  .chip-stop-t{font-size:10px;fill:var(--red);font-family:var(--font-mono)}
  .flowwrap.withd{margin-right:430px}
  @media (max-width:1240px){.flowwrap.withd{margin-right:0}}
  .minimap{position:absolute;right:10px;bottom:10px;border:1px solid var(--line2);
    border-radius:6px;background:rgba(6,8,11,.9);padding:4px}

  /* ---- inspector drawer ----------------------------------------------- */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;z-index:40;
    background:var(--surface);border-left:1px solid var(--line2);box-shadow:var(--shadow);
    display:flex;flex-direction:column}
  .drawer header{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
    border-bottom:1px solid var(--line);background:var(--surface2)}
  .drawer header h3{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
  .drawer .x{margin-left:auto;color:var(--dim);font-size:18px;line-height:1;padding:0 4px}
  .drawer .inner{overflow:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}

  /* ---- charts & heatmaps ---------------------------------------------- */
  .chart{width:100%}
  .heat{display:grid;gap:3px;font-size:10px}
  .heat .cellw{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
  .cell{height:20px;border-radius:4px;position:relative;border:1px solid var(--line)}
  .tiles{display:flex;flex-wrap:wrap;gap:3px}
  .tile{width:16px;height:16px;border-radius:3px;border:1px solid var(--line);
    position:relative;cursor:default}
  .legend{display:flex;gap:var(--s3);flex-wrap:wrap;color:var(--faint);font-size:10.5px;align-items:center}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}

  /* ---- log panes ------------------------------------------------------ */
  .log{font-family:var(--font-mono);font-size:11px;line-height:1.5;max-height:220px;
    overflow:auto;padding:var(--s2) var(--s3);background:#070a0d;border-radius:6px;
    border:1px solid var(--line);margin:0;white-space:pre-wrap;word-break:break-word}
  .log .err{color:var(--red)}
  .log .old{color:var(--faint)}
  .trunc{color:var(--faint);font-size:10px;padding:2px var(--s3) 0}

  /* ---- responsive ----------------------------------------------------- */
  @media (max-width:1180px){
    .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g21,.g12{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:900px){
    .app{grid-template-columns:64px minmax(0,1fr)}
    .brand h1,.brand .sub,.navitem .lbl,.sidenote,.sidelink span{display:none}
    .navitem{justify-content:center}
    .drawer{top:auto;left:0;width:auto;height:62vh;border-left:0;border-top:1px solid var(--line2)}
    .g2{grid-template-columns:minmax(0,1fr)}
    .flowsvg{height:calc(100vh - 300px);min-height:360px}
  }
  @media (max-width:640px){
    .g4,.g3{grid-template-columns:minmax(0,1fr)}
    .page{padding:var(--s3)}
    .hero .stats{margin-left:0}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.umd.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script>
/* Zero-Trust Trader dashboard.
 *
 * No build step: React + htm + ECharts are globals loaded from /vendor/.
 * Every number on this page comes from a file the engine wrote. When a file is
 * missing the page says so — it never renders a zero it did not observe.
 */
(function () {
"use strict";

const {useState, useEffect, useRef, useMemo, useCallback} = React;
const html = htm.bind(React.createElement);
const HAS_ECHARTS = typeof echarts !== "undefined";

/* ====================================================================== */
// BEGIN fixture-tested state helpers
/* Everything between these markers is pure: no DOM, no fetch, no React.
   dashboard/tests/ui.test.cjs loads this block with node:vm and asserts on it.
   Formatting, coherence, the ledger, the edge counts and the bar mirror all
   live here, so "what the page says" is testable without a browser. */

/* ======================================================================
   Formatting — one spelling of every number and every duration
   ====================================================================== */

const money = (v, c) => v == null ? "—"
  : Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " " + (c || "");
const num0 = (v) => v == null ? "—" : Number(v).toLocaleString();
const num2 = (v) => v == null ? "—" : Number(v).toFixed(2);
const pct = (v, d = 1) => v == null ? "—" : (Number(v) * 100).toFixed(d) + "%";
const signed = (v, d = 2) => v == null ? "—" : (v > 0 ? "+" : "") + Number(v).toFixed(d);

// 45 -> 45s, 120 -> 2m, 3600 -> 1h, 5400 -> 1h 30m, 90000 -> 1d 1h
const fmtDur = (s) => {
  if (s == null) return "—";
  const n = Math.max(0, Math.round(Number(s)));
  if (!Number.isFinite(n)) return "—";
  if (n < 60) return n + "s";
  const m = Math.floor(n / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (n < 600) return (n % 60) ? m + "m " + (n % 60) + "s" : m + "m";
  if (n < 3600) return m + "m";
  if (h < 24) return (m % 60) ? h + "h " + (m % 60) + "m" : h + "h";
  return (h % 24) ? d + "d " + (h % 24) + "h" : d + "d";
};

const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "local";
const localize = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString(undefined, {hour: "2-digit", minute: "2-digit", day: "2-digit", month: "short"});
};
const clockLocal = (unixS) => new Date(unixS * 1000)
  .toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit"});


/** The stage artifacts only describe *this* scan when the ids agree and they are
 *  recent. Otherwise they are history and the UI must say "historical". */
function scanCurrent(data) {
  if (!data || !data.scan) return false;
  return data.scan.current === true;
}

function transportFresh(receivedAt, now = Date.now()) {
  return receivedAt != null && (now - receivedAt) <= 5000;
}

/** The one sentence that tells you whether anything is watching the positions. */
function protectionLabel(data, ageSecs, transportLive) {
  if (!data) return "no engine state — positions unknown";
  if (!data.engine) return "no engine state — positions unknown";
  if (data.engine.ok === false) return "engine refusing — protection unverified";
  if (!transportLive || ageSecs == null) return "transport stale — protection unverified";
  // 30 s, not the alert rail's 120 s: the supervisor writes every second, so half
  // a minute of silence already means what you see is not what is happening.
  if (ageSecs > 30) return "engine stale — protection unverified";
  const n = (data.engine.positions || []).length;
  if (n === 0) return "confirmed flat";
  return data.engine.applied ? "apply enabled · observation current" : "observed only · dry run";
}

/** One line of funnel_history.log -> the row the UI needs, or null. Kept as a
 *  fallback for a server that predates the Rust ledger parser. */
function parseFunnel(line) {
  if (!line || typeof line !== "string") return null;
  const m = line.trim().match(/^(\S+)\s*\|(.*)\|(.*)$/);
  if (!m) return null;
  const rec = {ts: m[1], verdict: null, winners: []};
  (m[2] || "").trim().split(/\s+/).forEach((tok) => {
    const i = tok.indexOf("=");
    if (i > 0) {
      const k = tok.slice(0, i), v = tok.slice(i + 1);
      rec[k] = /^-?\d+$/.test(v) ? Number(v) : v;
    }
  });
  const tail = (m[3] || "").trim();
  rec.signed = /\bsig=\w+/.test(tail);
  const head = tail.replace(/\s*sig=\w+/, "").trim();
  const wi = head.indexOf("WINNER:");
  if (wi === 0) {
    rec.verdict = "WINNER";
    rec.winners = head.slice(7).split(",").map((s) => s.trim()).filter(Boolean);
  } else {
    const w = head.split(/\s+/)[0] || "";
    rec.verdict = ["STAND_DOWN", "FAILED", "REBUILT"].includes(w) ? w : "OTHER";
    if (rec.verdict === "FAILED") rec.detail = head.slice(w.length).trim() || null;
  }
  return rec;
}

function lastFunnel(lines) {
  if (!Array.isArray(lines) || !lines.length) return null;
  for (let i = lines.length - 1; i >= 0; i--) {
    const r = parseFunnel(lines[i]);
    if (r) return r;
  }
  return null;
}

/** Normalise the ledger: the Rust parser's rows, or the old tail if needed. */
function ledgerRows(data) {
  const rows = data && data.ledger && data.ledger.rows;
  if (Array.isArray(rows) && rows.length) return rows;
  const tail = (data && data.funnel) || [];
  const out = [];
  for (let i = tail.length - 1; i >= 0; i--) {
    const r = parseFunnel(tail[i]);
    if (r) out.push(r);
  }
  return out;
}

/** The six pipeline stages, from the artifacts alone. */
function pipeline(d) {
  const t2 = d && d.tier2;
  const t3 = d && d.tier3;
  const u = d && d.universe;
  const rows = ledgerRows(d);
  const last = rows[0] || null;
  return {
    in: u && u.present ? u.count : (t2 && t2.symbols_in != null ? t2.symbols_in : (last ? last.universe : null)),
    tested: t2 ? t2.symbols_tested : (last ? last.tested : null),
    tests: t2 ? t2.total_tests : (last ? last.total_tests : null),
    triggering: t2 ? t2.triggering : (last ? last.triggering : null),
    deduped: t2 ? (t2.deduped || []).length : (last ? last.deduped : null),
    shortlist: t3 ? (t3.results || []).length : (last ? last.shortlist : null),
    passed: t3 ? (t3.passed_both_gates || []).length : (last ? last.passed_both : null),
    cumulative: t3 ? t3.trials_cumulative : (last ? last.cumulative : null),
    bar: t3 ? t3.z_crit_corrected : null,
    gate: t3 ? (t3.results && t3.results[0] && t3.results[0].significance
      ? t3.results[0].significance.gate : null) : null,
    corr: (t2 && t2.corr_max) != null ? t2.corr_max : (t3 ? t3.corr_max : null),
    perFamily: (t2 && t2.per_family) || null,
    stoodDown: t3 ? !!t3.stood_down : null,
    last,
  };
}

/** What each edge carried. `null` means unknown, and an unknown edge draws no
 *  label — never a zero it did not see. */
function edgeCounts(x, data) {
  const cur = scanCurrent(data);
  if (!cur) {
    return {
      "scheduler>preflight": "15 min",
      "preflight>tier1": null,
      "tier1>tier2": null,
      "tier2>dedupe": null,
      "dedupe>tier3": null,
      "tier3>verdict": null,
      "verdict>consent": null,
      "consent>supervisor": "APPROVED + token",
      "supervisor>verdict": "protects, never opens",
    };
  }
  return {
    "scheduler>preflight": "15 min",
    "preflight>tier1": null,
    "tier1>tier2": x.tested == null ? null : x.tested + " in",
    "tier2>dedupe": x.triggering == null ? null : x.triggering + " fired",
    "dedupe>tier3": x.shortlist == null ? null : x.shortlist + " short",
    "tier3>verdict": x.passed == null ? null : x.passed + " passed",
    "verdict>consent": x.stoodDown === true ? "stand down" : x.stoodDown === false ? "proposal" : null,
    "consent>supervisor": "APPROVED + token",
    "supervisor>verdict": "protects, never opens",
  };
}

/** Which of the nine nodes is hot, and which edge shows flow. */
function edgeStates(progress, data) {
  const running = !!(progress && progress.status === "running");
  const stage = progress ? progress.stage : null;
  const cur = scanCurrent(data);
  const x = pipeline(data);
  // A scan in flight has no coherent artifacts yet; that is "running", not
  // "historical". Only a scan that ended without coherence is historical.
  const out = {running: running, stage: stage, hot: {}, blocked: {}, historical: !cur && !running};
  const map = {preflight: "scheduler>preflight", universe: "preflight>tier1", tier2: "tier1>tier2",
               tier3: "dedupe>tier3", verdict: "tier3>verdict"};
  if (running && map[stage]) out.hot[map[stage]] = true;
  if (cur && x.passed === 0) out.blocked["tier3>verdict"] = true;
  return out;
}

/** Drawdown series from an equity series, as a percentage below the running peak. */
function computeDrawdown(points) {
  if (!Array.isArray(points) || !points.length) return [];
  let peak = -Infinity;
  return points.map(([ts, v]) => {
    peak = Math.max(peak, v);
    return [ts, peak > 0 ? ((v - peak) / peak) * 100 : 0];
  });
}

/** Mirror of timemachine_mt5.bonferroni_z — Φ⁻¹(1 − 0.05/(2n)), two-sided, α=0.05.
 *  Labelled as a mirror wherever it is shown: the authoritative bar is the one the
 *  engine wrote into tier3. This exists to answer "what would N trials demand?" */
function bonferroniMirror(n) {
  if (!(n > 0)) return null;
  const p = 1 - 0.05 / (2 * n);
  // Acklam's inverse normal CDF, accurate to ~1e-9 over the useful range.
  const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02,
             1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
  const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
             6.680131188771972e+01, -1.328068155288572e+01];
  const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
             -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
  const dd = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,
              3.754408661907416e+00];
  const plow = 0.02425, phigh = 1 - plow;
  let q, r, x;
  if (p < plow) {
    q = Math.sqrt(-2 * Math.log(p));
    x = (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
        ((((dd[0]*q+dd[1])*q+dd[2])*q+dd[3])*q+1);
  } else if (p <= phigh) {
    q = p - 0.5; r = q * q;
    x = (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q /
        (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  } else {
    q = Math.sqrt(-2 * Math.log(1 - p));
    x = -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
         ((((dd[0]*q+dd[1])*q+dd[2])*q+dd[3])*q+1);
  }
  return Math.round(x * 1000) / 1000;
}

/** Which session's family list is active at a UTC instant, and when the next
 *  window opens. Mirrors run_funnel.session_strategies, for the countdown only. */
function sessionState(nowUtcHours) {
  const h = nowUtcHours;
  if (h >= 5 && h < 8) return {open: true, families: ["donchian"], label: "05:00–08:00Z", next: null};
  if (h >= 8 && h < 13) return {open: true, families: ["donchian", "bollinger"], label: "08:00–13:00Z", next: null};
  if (h >= 13 && h < 17) return {open: true, families: ["donchian", "rsi", "bollinger"], label: "13:00–17:00Z", next: null};
  const next = h < 5 ? 5 - h : 29 - h;
  return {open: false, families: [], label: "off-window", next: next};
}

/** Everything a view needs, derived once so the honesty rules live in one place. */
function derive(data, up, elapsed) {
  const age = data && data.engine_age_s != null ? data.engine_age_s + (elapsed || 0) : null;
  const cur = scanCurrent(data);
  const x = pipeline(data);
  const rows = ledgerRows(data);
  const t3 = cur && data ? data.tier3 : null;
  const survivors = t3 ? (t3.survivors || []).map((v) => (v && v.symbol) || v).filter(Boolean) : [];
  return {
    age: age,
    live: !!up && age != null && age <= 30,
    historical: !cur && (!!data && (!!data.tier2 || !!data.tier3)),
    scanId: data && data.scan ? data.scan.scan_id : null,
    current: cur,
    verdict: t3 ? (t3.stood_down ? "STAND_DOWN" : "PROPOSAL") : null,
    stoodDown: t3 ? !!t3.stood_down : null,
    survivors: survivors,
    cumulative: x.cumulative,
    bar: x.bar,
    rows: rows,
    x: x,
    edges: edgeCounts(x, data),
    states: edgeStates(data && data.progress, data),
    today: todayStats(rows, data && data.ts),
    protection: protectionLabel(data, age, up),
  };
}

/** Scans and tests that landed today (UTC), from the ledger alone. */
function todayStats(rows, nowS) {
  if (!Array.isArray(rows) || !rows.length) return {scans: null, tests: null, passed: null, verdicts: []};
  const now = nowS ? new Date(nowS * 1000) : new Date();
  const day = now.toISOString().slice(0, 10);
  const mine = rows.filter((r) => (r.ts || "").slice(0, 10) === day);
  if (!mine.length) return {scans: 0, tests: 0, passed: 0, verdicts: []};
  return {
    scans: mine.length,
    tests: mine.reduce((a, r) => a + (r.total_tests || 0), 0),
    passed: mine.reduce((a, r) => a + (r.passed_both || 0), 0),
    verdicts: mine.slice(0, 14),
  };
}

function Card({title, note, flush, children, className}) {
  return html`<section className=${"card " + (className || "")}>
    <header><h2>${title}</h2>${note ? html`<span className="note" title=${note}>${note}</span>` : null}</header>
    <div className=${"body " + (flush ? "flush" : "")}>${children}</div>
  </section>`;
}
const Badge = ({tone, children}) => html`<span className=${"badge " + (tone || "")}>${children}</span>`;
const Dim = ({children}) => html`<span className="l-faint">${children}</span>`;

function Empty({text, cmd}) {
  return html`<div className="empty"><div>${text}</div>${cmd ? html`<code>${cmd}</code>` : null}</div>`;
}

function CopyBtn({which, label, onCopy}) {
  const [state, setState] = useState("");
  const go = async () => {
    try { await onCopy(which); setState("done"); } catch (e) { setState("fail"); }
    setTimeout(() => setState(""), 1500);
  };
  return html`<button className=${"copy " + state} onClick=${go} aria-live="polite">
    ${state === "done" ? "copied ✓" : state === "fail" ? "copy failed" : (label || "copy " + which)}</button>`;
}

function LogPane({lines, missing, raw, onCopy, which}) {
  if (missing) return html`<${Empty} text=${"no " + which + " on disk — the engine has not written it yet"} />`;
  if (!lines || !lines.length) return html`<${Empty} text="the file exists and is empty" />`;
  const errIdx = lines.findIndex((l) => /ERROR|FAILED|refus/i.test(l) && !/RECOVERED/.test(l));
  return html`<div>
    <pre className="log">${lines.map((l, i) => html`<div key=${i}
      className=${errIdx >= 0 && i < errIdx ? "old" : errIdx === i ? "err" : ""}>${l}</div>`)}</pre>
    <div className="trunc">newest first · showing ${lines.length} lines from a bounded tail${raw ? " · raw" : ""}
      ${onCopy ? html` <${CopyBtn} which=${which} onCopy=${onCopy} label="copy" />` : null}</div>
  </div>`;
}

function Chart({option, height, empty}) {
  // A callback ref, not an effect: the instance is created the moment the node
  // attaches, which is the only moment echarts.init can trust. An effect with an
  // empty dependency list ran before the node existed in this build and left an
  // empty card with no error anywhere — the worst kind of failure.
  const inst = useRef(null);
  const attach = useCallback((node) => {
    if (inst.current) { try { inst.current.dispose(); } catch (_) {} inst.current = null; }
    if (!node || typeof echarts === "undefined") return;
    inst.current = echarts.init(node, null, {renderer: "canvas"});
    if (option) inst.current.setOption(option, {notMerge: true});
    if (typeof ResizeObserver !== "undefined") {
      const ro = new ResizeObserver(() => { if (inst.current) inst.current.resize(); });
      ro.observe(node);
    }
  }, []);
  useEffect(() => {
    if (inst.current && option) inst.current.setOption(option, {notMerge: true});
  }, [option]);
  // The container is always a div: swapping it for an "empty" element and back
  // meant the ref attached to a node React then discarded, and the chart drew
  // nothing with no error anywhere. The message overlays the same box instead.
  const h = height || 220;
  return html`<div style=${{position: "relative", minHeight: h + "px"}}>
    <div className="chart" ref=${attach} style=${{height: h + "px"}}></div>
    ${empty || typeof echarts === "undefined"
      ? html`<div style=${{position: "absolute", inset: 0, display: "grid", placeItems: "center"}}>
          <${Empty} text=${empty || "charts unavailable — the vendored ECharts did not load"} />
        </div>`
      : null}
  </div>`;
}

/* ---- chart helpers --------------------------------------------------- */

const C = {neon: "#00ffa3", cyan: "#22d3ee", magenta: "#f472b6", amber: "#ffb454",
           red: "#ff4d5e", dim: "#8b9bab", faint: "#5b6a79", line: "#1c2430"};

/** Time-axis formatting that follows the span: seconds under an hour, clock
 *  under a day, dates beyond. A flat 40-second capture must not read "19:25"
 *  five times. */
function timeAxis(points) {
  const span = points && points.length > 1 ? (points[points.length - 1][0] - points[0][0]) : 0;
  const mode = span < 3600 ? "time" : span < 86400 * 3 ? "daytime" : "date";
  const fmt = (v) => {
    const d = new Date(v);
    if (mode === "time") return d.toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit", second: "2-digit"});
    if (mode === "daytime") return d.toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit"});
    return d.toLocaleDateString(undefined, {day: "2-digit", month: "short"});
  };
  const axis = {type: "time", axisLine: {lineStyle: {color: C.line}},
                axisLabel: {color: C.faint, fontSize: 10, formatter: fmt}, splitNumber: 5};
  // A single observation would otherwise stretch the axis over ±12 hours and look
  // like a day of silence. One point means one minute of evidence.
  if (points && points.length === 1) {
    axis.min = points[0][0] * 1000 - 60000;
    axis.max = points[0][0] * 1000 + 60000;
  }
  return axis;
}

function baseOption(extra) {
  return Object.assign({
    backgroundColor: "transparent",
    textStyle: {fontFamily: "ui-monospace, monospace", color: C.dim, fontSize: 11},
    grid: {left: 46, right: 14, top: 18, bottom: 26},
    tooltip: {trigger: "axis", backgroundColor: "#0b0e12", borderColor: C.line,
              textStyle: {color: "#e8f0f2", fontSize: 11}, axisPointer: {lineStyle: {color: C.line}}},
    animation: false,
  }, extra || {});
}

function equityOption(points, bar) {
  if (!points || !points.length) return null;
  const vals = points.map((p) => p[1]);
  const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  // A constant series has no range of its own; give it one small enough that the
  // line stays a line instead of filling the card.
  const pad = hi === lo ? Math.max(0.5, Math.abs(hi) * 0.002) : (hi - lo) * 0.15;
  const dd = computeDrawdown(points);
  const ddLo = Math.min(0, Math.min.apply(null, dd.map((p) => p[1])));
  return baseOption({
    xAxis: timeAxis(points),
    yAxis: [
      {type: "value", min: lo - pad, max: hi + pad, splitLine: {lineStyle: {color: C.line}},
       axisLabel: {color: C.faint, fontSize: 10}},
      {type: "value", min: ddLo * 1.15, max: 0, position: "right", splitLine: {show: false},
       axisLabel: {color: "rgba(255,77,94,.65)", fontSize: 10, formatter: "{value}%"}},
    ],
    series: [
      {name: "equity", type: "line", showSymbol: points.length < 60, symbolSize: 3, data: points, yAxisIndex: 0,
       lineStyle: {color: C.neon, width: 1.6},
       areaStyle: {color: {type: "linear", x: 0, y: 0, x2: 0, y2: 1,
         colorStops: [{offset: 0, color: "rgba(0,255,163,.18)"}, {offset: 1, color: "rgba(0,255,163,0)"}]}},
       itemStyle: {color: C.neon}},
      {name: "drawdown %", type: "line", showSymbol: false, data: dd, yAxisIndex: 1,
       lineStyle: {color: "rgba(255,77,94,.6)", width: 1}, itemStyle: {color: C.red},
       areaStyle: {color: "rgba(255,77,94,.07)"}},
    ],
    legend: {show: false},
    tooltip: Object.assign({}, baseOption().tooltip, {
      formatter: (ps) => {
        if (!ps.length) return "";
        const t = new Date(ps[0].value[0]).toLocaleString();
        const eq = ps.find((p) => p.seriesName === "equity");
        const dr = ps.find((p) => p.seriesName === "drawdown %");
        return t + "<br/>equity " + num2(eq && eq.value[1]) +
               (dr ? "<br/>drawdown " + num2(dr.value[1]) + "%" : "");
      }}),
  });
}

function burnupOption(rows) {
  if (!rows || !rows.length) return null;
  const pts = rows.slice().reverse().map((r) => [r.ts, r.cumulative]);
  return baseOption({
    xAxis: timeAxis(pts),
    yAxis: {type: "value", splitLine: {lineStyle: {color: C.line}}, axisLabel: {color: C.faint, fontSize: 10}},
    series: [{type: "line", step: "end", showSymbol: pts.length < 60, symbolSize: 3, data: pts,
              lineStyle: {color: C.cyan, width: 1.8},
              areaStyle: {color: {type: "linear", x: 0, y: 0, x2: 0, y2: 1,
                colorStops: [{offset: 0, color: "rgba(34,211,238,.22)"}, {offset: 1, color: "rgba(34,211,238,0)"}]}},
              itemStyle: {color: C.cyan}}],
    tooltip: Object.assign({}, baseOption().tooltip, {
      formatter: (ps) => ps.length ? new Date(ps[0].value[0]).toLocaleString() + "<br/>cumulative trials " +
        num0(ps[0].value[1]) : ""}),
  });
}

   Flow canvas — nine nodes, edge counts, replay, inspect
   Appendix A of plan_ui.md: custom SVG, no second library, no bundler.
   ====================================================================== */

// 88 px between nodes: enough for an edge label ("0 passed", "16 fired") to sit
// on the wire without touching either box.
const NW = 180, NH = 78, GX = 46, GY = 44, COL = 268, ROW = 152;

const NODES = [
  {id: "scheduler", i: 1, title: "Scheduler", row: 0, col: 0},
  {id: "preflight", i: 2, title: "Pre-flight", row: 0, col: 1},
  {id: "tier1", i: 3, title: "Tier 1 · universe", row: 0, col: 2},
  {id: "tier2", i: 4, title: "Tier 2 · matrix", row: 0, col: 3},
  {id: "dedupe", i: 5, title: "Correlation", row: 1, col: 0},
  {id: "tier3", i: 6, title: "Tier 3 · deep test", row: 1, col: 1},
  {id: "verdict", i: 7, title: "Verdict", row: 1, col: 2},
  {id: "consent", i: 8, title: "Human + bridge", row: 1, col: 3},
  {id: "supervisor", i: 9, title: "Supervisor", row: 2, col: 2},
];

const EDGES = [
  ["scheduler", "preflight"], ["preflight", "tier1"], ["tier1", "tier2"],
  ["tier2", "dedupe"], ["dedupe", "tier3"], ["tier3", "verdict"],
  ["verdict", "consent"], ["consent", "supervisor"],
  ["supervisor", "verdict"],
];

const nodePos = (n) => ({x: GX + n.col * COL, y: GY + n.row * ROW, w: NW, h: NH});
const byId = (id) => NODES.find((n) => n.id === id);

/** Orthogonal path between two nodes. Same row runs straight; a row change goes
 *  down (or up) into the gutter, across, then into the target's near side. */
function edgePath(a, b) {
  const A = nodePos(a), B = nodePos(b);
  if (a.row === b.row && b.col > a.col) {
    const y = A.y + A.h / 2;
    return {d: `M ${A.x + A.w} ${y} L ${B.x} ${y}`, mx: (A.x + A.w + B.x) / 2, my: y - 8};
  }
  if (a.row === b.row && b.col < a.col) {
    const y = A.y + A.h / 2;
    return {d: `M ${A.x} ${y} L ${B.x + B.w} ${y}`, mx: (A.x + B.x + B.w) / 2, my: y - 8};
  }
  if (b.row > a.row) {
    const sx = A.x + A.w / 2, sy = A.y + A.h;
    const tx = B.x + B.w / 2, ty = B.y;
    const midY = sy + (ty - sy) / 2;
    return {d: `M ${sx} ${sy} L ${sx} ${midY} L ${tx} ${midY} L ${tx} ${ty}`,
            mx: (sx + tx) / 2, my: midY - 8};
  }
  // upward (the supervisor's protective return)
  const sx = A.x + A.w / 2, sy = A.y;
  const tx = B.x + B.w / 2, ty = B.y + B.h;
  const midY = ty + (sy - ty) / 2;
  return {d: `M ${sx} ${sy} L ${sx} ${midY} L ${tx} ${midY} L ${tx} ${ty}`,
          mx: (sx + tx) / 2, my: midY + 14};
}

function nodeStats(id, d, x) {
  const u = d.universe || {};
  const t2 = d.tier2, t3 = d.tier3, eng = d.engine;
  switch (id) {
    case "scheduler": {
      const s = sessionState(new Date().getUTCHours() + new Date().getUTCMinutes() / 60);
      return {s: s.open ? s.label : "off-window", c: s.open
        ? s.families.join(" · ") + " · " + (x.tests == null ? "—" : x.tests) + " tests"
        : "next window in " + fmtDur(Math.round(s.next * 3600)), tone: s.open ? "live" : ""};
    }
    case "preflight": {
      const p = d.progress;
      if (p && p.status === "failed") return {s: "refused", c: (p.error || "no reason given").slice(0, 60), tone: "bad"};
      const last = x.last;
      if (last && last.verdict === "FAILED") return {s: "FAILED", c: (last.detail || "unknown stage") + " · " + localize(last.ts), tone: "bad"};
      return {s: "passed", c: "demo pin ok · lock free", tone: "live"};
    }
    case "tier1":
      return {s: u.present ? num0(u.count) + " symbols" : "no universe",
              c: u.present ? "top by M15 turnover · " + (u.generated_utc ? fmtDur(Math.max(0, (Date.now() - Date.parse(u.generated_utc)) / 1000)) + " old" : "—")
                           : "run --rebuild",
              tone: u.present ? "" : "bad"};
    case "tier2":
      return {s: x.tests == null ? "—" : x.tests + " tests",
              c: x.tested == null ? "no scan yet" : x.tested + " tested · " + (x.triggering ?? "—") + " fired",
              tone: (x.tests != null && x.triggering === 0) ? "warn" : ""};
    case "dedupe":
      return {s: x.deduped == null ? "—" : x.deduped + " dropped", c: x.corr == null ? "ρ unknown" : "ρ max " + num2(x.corr) + " · gate 0.70"};
    case "tier3":
      return {s: x.shortlist == null ? "—" : x.shortlist + " deep-tested",
              c: "bar " + (x.bar == null ? "—" : num2(x.bar)) + " · gate " + (x.gate || "—") + " · 1000 perms"};
    case "verdict":
      return {s: x.stoodDown == null ? "—" : x.stoodDown ? "STAND DOWN" : "PROPOSAL",
              c: x.cumulative == null ? "—" : num0(x.cumulative) + " cumulative trials",
              tone: x.stoodDown === false ? "hot" : x.stoodDown === true ? "warn" : ""};
    case "consent":
      return {s: "human only", c: "types APPROVED · bridge holds the token"};
    case "supervisor":
      return {s: eng ? (eng.positions || []).length + " open" : "unknown",
              c: d.engine_age_s == null ? "no engine state" : "state " + fmtDur(d.engine_age_s) + " old",
              tone: d.engine_age_s == null ? "bad" : d.engine_age_s > 120 ? "warn" : "live"};
    default: return {s: "", c: ""};
  }
}

function FlowCanvas({d, sel, onSelect}) {
  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({x: 0, y: 0});
  const [drag, setDrag] = useState(null);
  const [replay, setReplay] = useState(-1);
  const wrap = useRef(null);
  const x = pipeline(d);
  const counts = edgeCounts(x, d);
  const states = edgeStates(d.progress, d);
  const W = GX * 2 + 3 * COL + NW, H = GY * 2 + 2 * ROW + NH;

  useEffect(() => {
    if (replay < 0) return;
    const t = setTimeout(() => {
      if (replay >= NODES.length) { setReplay(-1); return; }
      setReplay(replay + 1);
    }, 650);
    return () => clearTimeout(t);
  }, [replay]);

  const onWheel = (e) => {
    e.preventDefault();
    setZoom((z) => Math.min(2, Math.max(0.5, z * (e.deltaY < 0 ? 1.08 : 0.93))));
  };
  const onDown = (e) => { setDrag({x: e.clientX, y: e.clientY, px: pan.x, py: pan.y}); };
  const onMove = (e) => {
    if (!drag) return;
    setPan({x: drag.px + (e.clientX - drag.x), y: drag.py + (e.clientY - drag.y)});
  };
  const onUp = () => setDrag(null);
  const fit = () => { setZoom(1); setPan({x: 0, y: 0}); };

  const replayOn = replay >= 0;

  return html`<div className=${"flowwrap" + (sel ? " withd" : "")}>
    <div className="flowtop">
      <span className="badge info">${d.progress && d.progress.scan_id ? "scan " + String(d.progress.scan_id).slice(0, 8) : "no scan id"}</span>
      ${states.historical && !replayOn ? html`<span className="badge warn">historical — not the current scan</span>` : null}
      ${states.running ? html`<span className="badge pass">running · ${states.stage}</span>` : null}
      <button className="copy" onClick=${() => setReplay(replayOn ? -1 : 0)}>
        ${replayOn ? "stop replay" : "▶ replay last scan"}</button>
      <button className="copy" onClick=${fit}>fit view</button>
      <button className="copy" onClick=${() => setZoom((z) => Math.min(2, z * 1.2))}>+</button>
      <button className="copy" onClick=${() => setZoom((z) => Math.max(0.5, z / 1.2))}>−</button>
      <span className="badge">${Math.round(zoom * 100)}%</span>
      <span className="hint">${replayOn
        ? "reconstruction from the ledger — not recorded telemetry"
        : "edge labels are the counts that flowed · click a node to inspect"}</span>
    </div>
    <svg className=${"flowsvg" + (drag ? " dragging" : "")} viewBox=${`0 0 ${W} ${H}`}
      onWheel=${onWheel} onMouseDown=${onDown} onMouseMove=${onMove}
      onMouseUp=${onUp} onMouseLeave=${onUp} role="img"
      aria-label="the scan pipeline: scheduler to verdict to supervisor">
      <g transform=${`translate(${pan.x},${pan.y}) scale(${zoom})`}>
        ${EDGES.map(([a, b]) => {
          const A = byId(a), B = byId(b), p = edgePath(A, B);
          const key = a + ">" + b;
          const isReplay = replayOn && A.i <= replay && B.i <= replay;
          const cls = ["edge", states.hot[key] ? "hot" : "", states.blocked[key] ? "blocked" : "",
                       states.historical && !replayOn && !states.running ? "dim" : "",
                       isReplay ? "replay" : ""].filter(Boolean).join(" ");
          const label = counts[key];
          return html`<g key=${key}>
            <path className=${cls} d=${p.d} markerEnd="url(#arrow)"
              aria-label=${`flow from ${A.title} to ${B.title}${label ? ", " + label : ""}`} />
            ${label ? html`<g>
              <rect className="elabel-bg" x=${p.mx - label.length * 3.1 - 5} y=${p.my - 8}
                width=${label.length * 6.2 + 10} height=${15} rx=${4}></rect>
              <text className=${"elabel" + (states.blocked[key] ? " bad" : "")}
                x=${p.mx} y=${p.my + 3} textAnchor="middle">${label}</text>
            </g>` : null}
          </g>`;
        })}
        ${NODES.map((n) => {
          const pos = nodePos(n);
          const st = nodeStats(n.id, d, x);
          const isSel = sel === n.id;
          const done = replayOn && replay > NODES.indexOf(n);
          const tone = replayOn ? (n.i <= replay ? "hot" : "") : (st.tone || "");
          return html`<g key=${n.id} className=${"node " + tone + (isSel ? " sel" : "")}
              transform=${`translate(${pos.x},${pos.y})`} role="button" tabIndex="0"
              aria-pressed=${isSel ? "true" : "false"} aria-label=${n.title + ": " + st.s}
              onClick=${(e) => { e.stopPropagation(); onSelect(isSel ? null : n.id); }}
              onKeyDown=${(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onSelect(isSel ? null : n.id); } }}>
            <rect width=${pos.w} height=${pos.h}></rect>
            <text className="t" x=${12} y=${18}>${n.i} · ${n.title}</text>
            <circle cx=${pos.w - 12} cy=${13} r=${3.2} fill=${done ? C.neon : tone === "bad" ? C.red : tone === "warn" ? C.amber : tone === "hot" ? C.neon : C.faint}></circle>
            <text className="s" x=${12} y=${42}>${st.s}</text>
            <text className="c" x=${12} y=${61}>${String(st.c || "").slice(0, 34)}</text>
          </g>`;
        })}
      </g>
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#2b3646"></path>
        </marker>
      </defs>
    </svg>
    <svg className="minimap" width="150" height=${Math.round(150 * H / W)} viewBox=${`0 0 ${W} ${H}`}>
      ${NODES.map((n) => { const p = nodePos(n);
        return html`<rect key=${n.id} x=${p.x} y=${p.y} width=${p.w} height=${p.h} rx=${6}
          fill=${sel === n.id ? "rgba(34,211,238,.35)" : "rgba(139,155,171,.22)"} />`; })}
    </svg>
  </div>`;
}

function Inspector({id, d, onClose}) {
  if (!id) return null;
  const n = byId(id);
  const x = pipeline(d);
  const st = nodeStats(id, d, x);
  const rows = ledgerRows(d);
  const t2 = d.tier2, t3 = d.tier3;
  const body = () => {
    switch (id) {
      case "scheduler": {
        const now = new Date().getUTCHours() + new Date().getUTCMinutes() / 60;
        const s = sessionState(now);
        return html`<div>
          <p className="l-dim">Every family is another hypothesis the bar must pay for, so the
          window decides how many are tested.</p>
          <table><tbody>
            <tr><td>05:00–08:00Z</td><td className="num">donchian</td><td className="num">${x.in ? x.in : "—"} tests</td></tr>
            <tr><td>08:00–13:00Z</td><td className="num">donchian + bollinger</td><td className="num">${x.in ? x.in * 2 : "—"}</td></tr>
            <tr><td>13:00–17:00Z</td><td className="num">all three</td><td className="num">${x.in ? x.in * 3 : "—"}</td></tr>
          </tbody></table>
          <p className="l-dim">Now: <b>${s.open ? s.label : "off-window"}</b>${s.next ? " · next window in " + fmtDur(Math.round(s.next * 3600)) : ""}</p>
        </div>`;
      }
      case "preflight":
        return html`<div>
          <table><tbody>
            <tr><td>demo-only server</td><td className="num">${d.server || "—"}</td></tr>
            <tr><td>account pin</td><td className="num">${d.alerts && d.alerts.some((a) => a.id === "engine_missing") ? "unverified" : "verified by pre-flight"}</td></tr>
            <tr><td>last refusal</td><td className="num">${(rows.find((r) => r.verdict === "FAILED") || {}).ts || "none"}</td></tr>
          </tbody></table>
          <p className="l-dim">Anything that cannot be verified refuses the scan. A refusal is a fact
          about the machine, not about the market.</p>
        </div>`;
      case "tier1":
        return html`<div>
          <p className="l-dim">${(d.universe || {}).present
            ? num0(d.universe.count) + " symbols, rebuilt " + (d.universe.generated_utc ? localize(d.universe.generated_utc) : "—")
            : "No universe file on disk."}</p>
          ${(d.universe && d.universe.symbols || []).slice(0, 24).map((s) => html`
            <div key=${s.symbol} className="rowline" style=${{display: "flex", gap: "8px", fontSize: "11.5px"}}>
              <span className="mono" style=${{width: "110px"}}>${s.symbol}</span>
              <span className="l-faint" style=${{width: "54px"}}>${s.class}</span>
              <span className="mono l-dim">${num2(s.spread_pct_atr)}% of ATR</span>
            </div>`)}
        </div>`;
      case "tier2":
        return html`<div>
          <p className="l-dim">${x.tested == null ? "No matrix artifact for the current scan." :
            x.tested + " symbols tested · " + num0(x.tests) + " hypotheses · " + (x.triggering ?? "—") + " fired"}</p>
          ${t2 && t2.per_family ? html`<div className="legend">${Object.entries(t2.per_family).map(([k, v]) =>
            html`<span key=${k}><i style=${{background: C.cyan}}></i>${k} ${v}</span>`)}</div>` : null}
          ${t2 && (t2.all_hits || []).length ? html`<table><thead><tr><th>symbol</th><th>family</th><th className="num">score</th></tr></thead>
            <tbody>${t2.all_hits.slice(0, 20).map((h) => html`<tr key=${h.symbol + h.strategy}>
              <td className="mono">${h.symbol}</td><td>${h.strategy}</td><td className="num">${num2(h.score)}</td></tr>`)}</tbody></table>`
            : html`<${Empty} text="no hits in the current artifact" />`}
        </div>`;
      case "dedupe":
        return html`<div>
          ${t2 && (t2.deduped || []).length ? t2.deduped.map((drow, i) => html`<div key=${i} style=${{marginBottom: "8px"}}>
            <div className="mono">${drow.symbol} → kept ${drow.kept_instead}</div>
            <div className="l-faint">ρ ${num2(drow.correlation)} · ${drow.reason || "correlated with a stronger hit"}</div>
          </div>`) : html`<${Empty} text="nothing was deduped in the current scan" />`}
        </div>`;
      case "tier3":
        return html`<div>
          ${(t3 && t3.results || []).map((r) => html`<div key=${r.symbol + r.strategy} style=${{borderTop: "1px solid #1c2430", paddingTop: "6px", marginTop: "6px"}}>
            <div className="mono">${r.symbol} · ${r.strategy}</div>
            <div className="l-dim">${r.significance ? ("avg R " + signed(r.significance.mean_net_R) + " · t " + num2(r.significance.t_stat_R)) : ""}
              ${r.permutation ? (" · p " + num2(r.permutation.p_value)) : ""}</div>
          </div>`)}
        </div>`;
      case "verdict":
        return html`<div>
          <p className="l-dim">${x.cumulative == null ? "" : num0(x.cumulative) + " cumulative trials set the bar at " +
            (x.bar == null ? "—" : num2(x.bar)) + "."}</p>
          ${x.stoodDown ? html`<p className="l-dim">Standing down is the system working: no candidate cleared both gates.</p>` : null}
        </div>`;

        return html`<div>

          <p className="l-faint">Trails stops, moves to break-even, closes at session end. It cannot open,

        </div>`;
      default:
        return null;
    }
  };
  return html`<div>
    <div className="scrim" onClick=${onClose}></div>
    <aside className="drawer" role="dialog" aria-label=${n.title}>
      <header><h3>${n.i} · ${n.title}</h3><button className="x" onClick=${onClose} aria-label="close">×</button></header>
      <div className="inner">
        <div className="kpi"><span className="k">${st.s}</span><span className="h">${st.c}</span></div>
        ${body()}
      </div>
    </aside>
  </div>`;
}

function VerdictHero({d}) {
  const tone = d.stoodDown === false ? "up" : d.stoodDown === true ? "" : "pending";
  const title = d.stoodDown === false ? "PROPOSAL — " + (d.survivors.join(", ") || "unnamed survivor")
    : d.stoodDown === true ? "STANDING DOWN — no edge found"
    : "SCAN UNVERIFIED — no current verdict";
  const sub = d.stoodDown === false ? "cleared both gates; a human still has to approve it"
    : d.stoodDown === true ? "Standing down is the system working: nothing cleared both gates."
    : "The artifacts on disk do not belong to an unexpired, coherent scan.";
  return html`<div className=${"hero " + tone} aria-live="polite">
    <span className="tag">${d.stoodDown === false ? "edge" : d.stoodDown === true ? "verdict" : "pending"}</span>
    <div><h2>${title}</h2><div className="sub">${sub}</div></div>
    <div className="stats">
      <div><span>trials</span><b className="mono">${num0(d.cumulative)}</b></div>
      <div><span>bar</span><b className="mono">${d.bar == null ? "—" : num2(d.bar)}</b></div>
      <div><span>today</span><b className="mono">${d.today.scans == null ? "—" : d.today.scans + " scans"}</b></div>
    </div>
  </div>`;
}

function Positions({data}) {

  return html`<table><thead><tr><th>ticket</th><th>symbol</th><th>side</th><th className="num">lots</th>
    <th className="num">entry</th><th className="num">stop</th><th className="num">price</th><th className="num">P&amp;L</th></tr></thead>

function Desk({agent, compact}) {
  if (!agent) return html`<${Empty} text="the desk has not run on this tree" cmd="python agent_brief.py" />`;
  const roles = agent.roles || {};

  return html`<div>
    <div className="chain">${order.map(([key, label]) => {

}

    </div>
    <div className="grid g21">
      <${Card} title="Desk · the four-agent chain" note=${"advisory only — no path to the terminal"}>
        <${Desk} agent=${data && data.agent} compact=${true} />
      <//>
      <${Card} title="Today">
        <div className="kpi" style=${{marginBottom: "8px"}}>
          <span className="k">${d.today.scans == null ? "no ledger" : d.today.scans + " scans · " + num0(d.today.tests) + " tests · " + d.today.passed + " passed"}</span>
          <span className="h">${d.today.verdicts.length ? "recent verdicts" : "nothing yet today"}</span>
        </div>
        <div style=${{display: "flex", gap: "4px", flexWrap: "wrap"}}>
          ${d.today.verdicts.map((r, i) => html`<span key=${i}
            className=${"badge " + (r.verdict === "WINNER" ? "pass" : r.verdict === "FAILED" ? "bad" : "info")}
            title=${localize(r.ts) + " · " + num0(r.total_tests) + " tests"}>
            ${(r.ts || "").slice(11, 16)} ${r.verdict === "STAND_DOWN" ? "SD" : r.verdict}</span>`)}

      <//>

    <${Card} title="Positions">

}

/* ---- Research -------------------------------------------------------- */

function Research({d, data}) {
  const t3 = d.current && data ? data.tier3 : null;
  const results = (t3 && t3.results) || [];
  const u = (data && data.universe) || {};

  const gateRows = results.map((r) => {
    const s = r.significance || {}, p = r.permutation || {};
    return {
      key: r.symbol + "/" + r.strategy,
      symbol: r.symbol, strategy: r.strategy, side: r.side,
      naive: s.z != null ? s.z : null,
      corrected: (s.z != null && s.z_crit_bonferroni != null) ? s.z - s.z_crit_bonferroni : null,
      perm: p.p_value != null ? 0.05 - p.p_value : null,
      passesNaive: !!s.passes_naive, passesCorrected: !!s.passes_corrected, passesPerm: !!p.passes,
      avgR: s.mean_net_R, t: s.t_stat_R,
    };
  });

  const cells = (v, pass) => {
    if (v == null) return html`<div className="cell" title="no value"></div>`;
    const mag = Math.min(1, Math.abs(v) / 5);
    const col = pass ? `rgba(0,255,163,${0.12 + mag * 0.5})` : `rgba(255,77,94,${0.10 + mag * 0.45})`;
    return html`<div className="cell" style=${{background: col}} title=${num2(v)}></div>`;
  };

  // weekday x hour activity, built only from rows that exist
  const act = useMemo(() => {
    const grid = Array.from({length: 7}, () => Array(24).fill(null));
    for (const r of d.rows) {
      const t = new Date(r.ts);
      if (isNaN(t)) continue;
      const day = (t.getUTCDay() + 6) % 7, hr = t.getUTCHours();
      const cur = grid[day][hr] || {tests: 0, scans: 0, verdicts: []};
      cur.tests += r.total_tests || 0;
      cur.scans += 1;
      cur.verdicts.push(r.verdict);
      grid[day][hr] = cur;
    }
    return grid;
  }, [d.rows]);

  const tiles = (u.symbols || []).slice(0, 260);
  const tileCol = (v) => {
    if (v == null) return "rgba(139,155,171,.15)";
    const f = Math.min(1, v / 15);
    return `rgba(${Math.round(0 + f * 255)},${Math.round(255 - f * 190)},${Math.round(163 - f * 140)},.75)`;
  };

  return html`<div className="contents">
    <div className="grid g21">
      <${Card} title="Gate margin — why it was refused"
        note=${x2(d) ? "bar " + num2(d.bar) + " · gate " + (d.x.gate || "—") : "no current scan"}>
        ${gateRows.length ? html`<table>
          <thead><tr><th>candidate</th><th>naive 1.96</th><th>corrected</th><th>permutation</th><th className="num">avg R</th></tr></thead>
          <tbody>${gateRows.map((g) => html`<tr key=${g.key}>
            <td className="mono">${g.symbol}<span className="l-faint"> · ${g.strategy}</span></td>
            <td>${cells(g.naive, g.passesNaive)}</td>
            <td>${cells(g.corrected, g.passesCorrected)}</td>
            <td>${cells(g.perm, g.passesPerm)}</td>
            <td className=${"num " + ((g.avgR || 0) >= 0 ? "l-good" : "l-bad")}>${signed(g.avgR, 3)}</td></tr>`)}
          </tbody></table>` : html`<${Empty} text="no candidate was deep-tested in the current scan" />`}
        <div className="l-faint" style=${{fontSize: "11px", marginTop: "8px"}}>
          Cleared a naive 1.96 and failed the corrected bar? That is exactly what the best of N draws
          produces by luck — saying so is the product's voice.
        </div>
      <//>
      <${Card} title="Universe health" note=${u.present ? num0(u.count) + " symbols · " + (u.generated_utc ? localize(u.generated_utc) : "age unknown") : "no universe file"}>
        ${u.present ? html`<div className="tiles">${tiles.map((s) => html`<div key=${s.symbol} className="tile"
          style=${{background: tileCol(s.spread_pct_atr)}}
          title=${`${s.symbol} · ${s.class} · spread ${num2(s.spread_pct_atr)}% of ATR`}></div>`)}</div>`
          : html`<${Empty} text="no universe on disk — run the rebuild" cmd="python make_liquid.py --top 120" />`}
        <div className="legend" style=${{marginTop: "8px"}}>
          <span><i style=${{background: "rgba(0,255,163,.75)"}}></i>tight spread</span>
          <span><i style=${{background: "rgba(255,77,94,.75)"}}></i>at the 15% veto</span>
        </div>
      <//>
    </div>

    <${Card} title="Trials activity — weekday × hour UTC" note="intensity = tests · ring = verdict">
      <div className="heat" style=${{gridTemplateColumns: "34px repeat(24, minmax(0,1fr))"}}>
        <div></div>
        ${Array.from({length: 24}, (_, h) => html`<div key=${h} className="cellw" style=${{textAlign: "center"}}>${h}</div>`)}
        ${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((dn, day) => html`<${React.Fragment} key=${dn}>
          <div className="cellw">${dn}</div>
          ${Array.from({length: 24}, (_, h) => {
            const c = act[day][h];
            if (!c) return html`<div key=${h} className="cell" style=${{background: "transparent"}} title="no scan"></div>`;
            const mag = Math.min(1, Math.sqrt(c.tests) / 22);
            const bad = c.verdicts.some((v) => v === "FAILED");
            const good = c.verdicts.some((v) => v === "WINNER");
            const border = good ? C.magenta : bad ? C.red : C.line2;
            return html`<div key=${h} className="cell"
              style=${{background: `rgba(34,211,238,${0.08 + mag * 0.55})`, borderColor: border}}
              title=${`${dn} ${String(h).padStart(2, "0")}:00Z · ${c.scans} scans · ${num0(c.tests)} tests`}></div>`;
          })}
        <//>`)}
      </div>
      <div className="l-faint" style=${{fontSize: "11px", marginTop: "6px"}}>
        Empty cells are hours with no scan. They are not zero-test hours — the ledger has no row for them.
      </div>
    <//>

    <${Card} title="Candidate cards" note=${results.length ? results.length + " deep-tested" : "nothing to show"}>
      ${results.length ? results.map((r) => {
        const s = r.significance || {}, p = r.permutation || {}, h = r.history || {}, mc = r.mc || {};
        const buckets = [["target", h.target], ["stop", h.stop], ["session", h.session], ["horizon", h.horizon], ["neither", h.neither]];
        const total = buckets.reduce((a, b) => a + (b[1] || 0), 0) || 1;
        return html`<div key=${r.symbol + r.strategy} style=${{borderTop: "1px solid #1c2430", padding: "10px 0"}}>
          <div style=${{display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap"}}>
            <b className="mono">${r.symbol}</b><span className="l-dim">${r.strategy}</span>
            <span className="badge">${r.side}</span>
            <span className=${"badge " + (s.passes_corrected ? "pass" : "bad")}>t ${num2(s.t_stat_R)} vs ${num2(s.z_crit_bonferroni)}</span>
            <span className=${"badge " + (p.passes ? "pass" : "bad")}>p ${num2(p.p_value)}</span>
            <span className=${"badge " + ((h.win_rate || 0) > 0 ? "info" : "")}>win ${pct(h.win_rate)}</span>
            <span className="badge">avg R ${signed(s.mean_net_R, 3)}</span>
          </div>
          <div style=${{display: "flex", height: "8px", borderRadius: "4px", overflow: "hidden", margin: "7px 0 4px"}}>
            ${buckets.map(([k, v]) => html`<div key=${k} title=${k + ": " + (v || 0)}
              style=${{width: ((v || 0) / total * 100) + "%", background:
                k === "target" ? C.neon : k === "stop" ? C.red : k === "session" ? C.cyan :
                k === "horizon" ? C.amber : "#2a313b"}}></div>`)}
          </div>
          <div className="l-faint" style=${{fontSize: "10.5px"}}>
            ${buckets.map(([k, v]) => k + " " + (v || 0)).join(" · ")} = ${num0(h.occurrences)}
            ${mc.p_target != null ? " · MC p_target " + pct(mc.p_target) + " p_stop " + pct(mc.p_stop) : ""}
          </div>
          ${mc.limitations ? html`<div className="l-warn" style=${{fontSize: "10.5px"}}>${mc.limitations}</div>` : null}
          ${r.current ? html`<div className="mono l-dim" style=${{fontSize: "10.5px", marginTop: "3px"}}>
            entry ${num2(r.current.proposed_entry)} · stop ${num2(r.current.proposed_stop)} · target ${num2(r.current.proposed_target)}</div>` : null}
        </div>`;
      }) : html`<${Empty} text="no deep test for the current scan — the funnel stood down before tier 3" />`}
    <//>

    <div className="legend">
      <a className="sidelink" href="/api/report/latest" target="_blank" rel="noopener">open the full per-scan report ↗</a>
    </div>
  </div>`;
}
const x2 = (d) => d.current;

/* ---- Performance ----------------------------------------------------- */

function Performance({d, data}) {
  const series = (data && data.series) || {};
  const pts = (series.equity && (series.equity["14d"] || series.equity["48h"] || series.equity["2h"])) || [];
  const opt = useMemo(() => equityOption(pts), [pts]);
  const results = (d.current && data && data.tier3 && data.tier3.results) || [];
  const fams = {};
  (data && data.tier2 && data.tier2.per_family ? Object.entries(data.tier2.per_family) : []).forEach(([k, v]) => {
    fams[k] = fams[k] || {triggers: v, deep: 0, passed: 0, stat: []};
  });
  results.forEach((r) => {
    const k = r.strategy;
    fams[k] = fams[k] || {triggers: 0, deep: 0, passed: 0, stat: []};
    fams[k].deep++;
    if (r.significance && r.significance.passes_corrected) fams[k].passed++;
    if (r.significance && r.significance.t_stat_R != null) fams[k].stat.push(Math.abs(r.significance.t_stat_R));
  });
  const cadence = d.rows.slice(0, 400).map((r) => [r.ts, r.total_tests]);
  const cadOpt = cadence.length ? baseOption({
    xAxis: timeAxis(cadence),
    yAxis: {type: "value", splitLine: {lineStyle: {color: C.line}}, axisLabel: {color: C.faint, fontSize: 10}},
    series: [{type: "scatter", symbolSize: 7,
      data: cadence.map(([ts, v], i) => ({value: [ts, v],
        itemStyle: {color: d.rows[i].verdict === "WINNER" ? C.magenta : d.rows[i].verdict === "FAILED" ? C.red : C.cyan}}))}],
    tooltip: {trigger: "item", backgroundColor: "#0b0e12", borderColor: C.line,
      formatter: (p) => new Date(p.value[0]).toLocaleString() + "<br/>" + num0(p.value[1]) + " tests"},
  }) : null;
  return html`<div className="contents">
    <${Card} title="Equity and drawdown" note=${series.since_ts ? "in-memory since " + localize(new Date(series.since_ts * 1000).toISOString()) : "no observations"}>
      <${Chart} option=${opt} height=${280} empty=${pts.length ? null : "no equity observations yet"} />
    <//>
    <div className="grid g2">
      <${Card} title="Outcome mix" note="target / stop / session / horizon / neither">
        ${results.length ? results.map((r) => {
          const h = r.history || {};
          const b = [["target", h.target, C.neon], ["stop", h.stop, C.red], ["session", h.session, C.cyan],
                     ["horizon", h.horizon, C.amber], ["neither", h.neither, "#2a313b"]];
          const tot = b.reduce((a, x) => a + (x[1] || 0), 0) || 1;
          return html`<div key=${r.symbol + r.strategy} style=${{marginBottom: "9px"}}>
            <div className="mono" style=${{fontSize: "11.5px"}}>${r.symbol} <span className="l-faint">${r.strategy}</span></div>
            <div style=${{display: "flex", height: "9px", borderRadius: "4px", overflow: "hidden", marginTop: "3px"}}>
              ${b.map(([k, v, c]) => html`<div key=${k} title=${k + " " + (v || 0)} style=${{width: ((v || 0) / tot * 100) + "%", background: c}}></div>`)}
            </div>
          </div>`;
        }) : html`<${Empty} text="no candidate history in the current scan" />`}
      <//>
      <${Card} title="Family leaderboard" note="families must add a different bet, not duplicate exposure">
        <table><thead><tr><th>family</th><th className="num">fired</th><th className="num">deep</th><th className="num">avg |t|</th></tr></thead>
          <tbody>${Object.entries(fams).map(([k, v]) => html`<tr key=${k}>
            <td>${k}</td><td className="num">${num0(v.triggers)}</td><td className="num">${v.deep}</td>
            <td className="num">${v.stat.length ? num2(v.stat.reduce((a, b) => a + b, 0) / v.stat.length) : "—"}</td></tr>`)}
          </tbody></table>
      <//>
    </div>
    <${Card} title="Scan cadence" note="one dot per ledger row · gaps mean no scan, never interpolated">
      <${Chart} option=${cadOpt} height=${180} empty=${cadOpt ? null : "no ledger rows"} />
    <//>
    <${Card} title="Positions"><${Positions} data=${data} /><//>
  </div>`;
}

/* ---- Trials ---------------------------------------------------------- */

function Trials({d, data}) {
  const burn = useMemo(() => burnupOption(d.rows), [d.rows]);
  const best = (d.current && data && data.tier3 && data.tier3.results || [])
    .map((r) => ({k: r.symbol + "/" + r.strategy, t: r.significance && r.significance.t_stat_R}))
    .filter((r) => r.t != null)
    .sort((a, b) => Math.abs(b.t) - Math.abs(a.t))[0];
  const whatIf = [1, 150, 525, 1791, 5388, 9081, 40388, 155388];
  return html`<div className="contents">
    <${Card} title="Cumulative trials" note="each row is a hypothesis the bar must pay for">
      <${Chart} option=${burn} height=${200} empty=${burn ? null : "no ledger rows on this tree"} />
    <//>
    <div className="grid g21">
      <${Card} title="The bar" note="set by every hypothesis ever tested — not by this scan">
        <div style=${{display: "flex", gap: "24px", alignItems: "baseline", flexWrap: "wrap"}}>
          <div className="kpi"><span className="k">corrected bar</span><span className="v">${d.bar == null ? "—" : num2(d.bar)}</span></div>
          <div className="kpi"><span className="k">cumulative</span><span className="v">${num0(d.cumulative)}</span></div>
          <div className="kpi"><span className="k">best today</span><span className="v">${best ? num2(best.t) : "—"}</span>
            <span className="h">${best ? best.k : "nothing deep-tested"}</span></div>
          <div className="kpi"><span className="k">margin</span>
            <span className=${"v " + (best && d.bar != null && Math.abs(best.t) > d.bar ? "l-good" : "l-bad")}>
              ${best && d.bar != null ? signed(Math.abs(best.t) - d.bar) : "—"}</span></div>
        </div>
      <//>
      <${Card} title="What-if · mirror" note="mirror of timemachine_mt5.bonferroni_z — exploration only">
        <table><tbody>${whatIf.map((n) => html`<tr key=${n}>
          <td className="num mono">${num0(n)}</td><td className="num mono l-dim">${num2(bonferroniMirror(n))}</td></tr>`)}</tbody></table>
        <div className="l-faint" style=${{fontSize: "10.5px", marginTop: "6px"}}>
          The authoritative bar is the one the engine wrote into the ledger and tier 3.
        </div>
      <//>
    </div>
    <${Card} title="Ledger" note=${data && data.ledger && data.ledger.truncated
      ? "newest " + d.rows.length + " rows · window " + Math.round((data.ledger.window_bytes || 0) / 1024) + " KiB of " + Math.round((data.ledger.total_bytes || 0) / 1024) + " KiB"
      : d.rows.length + " rows"} flush=${true}>
      ${d.rows.length ? html`<table>
        <thead><tr><th>when</th><th className="num">universe</th><th className="num">tested</th><th className="num">tests</th>
          <th className="num">fired</th><th className="num">short</th><th className="num">passed</th>
          <th className="num">cumulative</th><th>verdict</th></tr></thead>
        <tbody>${d.rows.slice(0, 120).map((r, i) => html`<tr key=${i}>
          <td className="mono" title=${r.ts}>${localize(r.ts)}</td>
          <td className="num">${num0(r.universe)}</td><td className="num">${num0(r.tested)}</td>
          <td className="num">${num0(r.total_tests)}</td><td className="num">${num0(r.triggering)}</td>
          <td className="num">${num0(r.shortlist)}</td><td className="num">${num0(r.passed_both)}</td>
          <td className="num">${num0(r.cumulative)}</td>
          <td><span className=${"badge " + (r.verdict === "WINNER" ? "pass" : r.verdict === "FAILED" ? "bad" : "info")}>
            ${r.verdict === "STAND_DOWN" ? "STAND DOWN" : r.verdict}${r.signed ? "" : " !"}</span></td>
        </tr>`)}</tbody></table>` : html`<${Empty} text="no scan has run on this tree yet" cmd="python run_funnel.py" />`}
      <div className="l-faint" style=${{fontSize: "10.5px", padding: "6px 12px"}}>
        A <b>!</b> means the row carries no sig= segment. This page reports presence only — verification
        happens in status.py.
      </div>
    <//>
  </div>`;
}

/* ---- Ops ------------------------------------------------------------- */

        ${alerts.map((a) => html`<div key=${a.id} className="rowline" style=${{display: "flex", gap: "8px", alignItems: "baseline"}}>
          <span className=${"badge " + (a.severity === "error" ? "bad" : a.severity === "warn" ? "warn" : "info")}>${a.severity}</span>
          <span>${a.message}</span><span className="l-faint mono" style=${{marginLeft: "auto", fontSize: "10.5px"}}>${a.id}</span>

        <tr><td className="mono">.ztt-maintenance</td>
          <td className="num">${health.maintenance && health.maintenance.active

      <${Card} title="Funnel history" note="the raw lines the parser reads">

    <//>
    <div className="l-faint" style=${{fontSize: "11px"}}>
      What this page cannot see: policy values, Task Scheduler state and the terminal itself.

}
